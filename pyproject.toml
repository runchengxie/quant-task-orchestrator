[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "quant-task-orchestrator"
version = "0.7.0"
description = "Thin, owner-aware coordination for quantitative research workflows"
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
dependencies = []

[project.scripts]
quant-task = "quant_task_orchestrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_task_orchestrator"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.hatch.build.targets.wheel.force-include]
"site" = "quant_task_orchestrator/web"
